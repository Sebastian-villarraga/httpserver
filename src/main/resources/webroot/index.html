<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Web Framework</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <main class="container">

        <h1>Mi Java Web Framework</h1>

        <p>
            Aplicación construida con nuestro servidor HTTP.
        </p>

        <section>
            <h2>Probar /hello</h2>

            <input
                type="text"
                id="name"
                placeholder="Escribe tu nombre">

            <button onclick="greet()">
                Saludar
            </button>

            <p id="result"></p>
        </section>

        <section>
            <h2>Información</h2>

            <p>
                Este contenido es servido como archivo estático.
            </p>

            <img
                src="/images/logo.png"
                alt="Logo"
                class="logo">
        </section>

    </main>

    <script src="/app.js"></script>

</body>

</html>
